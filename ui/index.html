<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Taskbar Liquid Lyrics</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- 🧊 Floating Dynamic Island Capsule (100% Window Fit, Zero Black Wings) -->
  <div class="taskbar-capsule style-2 text-white is-standby" id="capsuleRoot" title="點擊拖曳・右鍵開啟外觀設定">
    <!-- 🌊 GPU Internal RGB Fluid Audio Wave -->
    <canvas id="waveCanvas"></canvas>

    <!-- 🎵 Left Album Art (Cover image only) -->
    <div class="capsule-art-box" id="artBox" style="display: none;">
      <img id="albumArt" class="capsule-art-img" alt="Cover" src="">
    </div>

    <!-- 🎤 Lyrics & Track Info Stage -->
    <div class="capsule-content" id="contentArea">
      <div class="lyrics-stage" id="lyricsStage">
        <div class="lyric-line-active" id="activeLyric">點擊播放音樂以同步歌詞...</div>
      </div>
      <div class="track-marquee-wrapper" id="trackMarqueeWrapper" style="display: none;">
        <span class="track-marquee-text" id="trackMarqueeText">未在播放</span>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/lyrics_engine.js"></script>
  <script src="js/wave_engine.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
